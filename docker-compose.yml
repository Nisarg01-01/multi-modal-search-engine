services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./scripts:/app/scripts
      - ./data:/app/data
      - ./data/flipkart/images:/app/static/images # Mount Flipkart images
      - ./.env:/app/.env
    environment:
      MMSE_WEAVIATE_HOST: weaviate
      MMSE_WEAVIATE_HTTP_PORT: 8080
      MMSE_WEAVIATE_GRPC_PORT: 50051
      MMSE_CLIP_DEVICE: cpu
      MMSE_LOG_LEVEL: INFO
    depends_on:
      weaviate:
        condition: service_healthy

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.27.0
    ports:
      - "8080:8080"
      - "50051:50051"
    volumes:
      - weaviate_data:/var/lib/weaviate
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: "none"
      CLUSTER_HOSTNAME: "node1"
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:8080/v1/.well-known/ready" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 3g

  frontend:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ./ui.py:/app/ui.py
    command: streamlit run ui.py --server.port 8501 --server.address 0.0.0.0
    depends_on:
      - api

volumes:
  weaviate_data:
