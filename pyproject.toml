[project]
name = "multi-modal-search-engine"
version = "0.1.0"
description = "AI Powered Search Engine with Multi Modal capabilites"
authors = [
    {name = "Nisarg Shah",email = "nisargshah8b@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi (>=0.116.1,<0.117.0)",
    "uvicorn[standard] (>=0.35.0,<0.36.0)",
    "weaviate-client (>=4.16.6,<5.0.0)",
    "requests (>=2.32.4,<3.0.0)",
    "datasets (>=4.0.0,<5.0.0)",
    "pyarrow (>=21.0.0,<22.0.0)",
    "beautifulsoup4 (>=4.13.4,<5.0.0)",
    "lxml (>=6.0.0,<7.0.0)",
    "huggingface-hub (>=0.34.4,<0.35.0)",
    "sentence-transformers (>=5.1.0,<6.0.0)",
    "tqdm (>=4.67.1,<5.0.0)",
    "pillow (>=11.3.0,<12.0.0)",
    "streamlit (>=1.48.0,<2.0.0)",
    "pandas (>=2.3.1,<3.0.0)",
    "fiftyone (>=1.7.2,<2.0.0)",
    "python-multipart (>=0.0.20,<0.0.21)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
black = "^25.1.0"
ruff = "^0.12.8"
pre-commit = "^4.3.0"
